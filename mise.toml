# Версия CLI также закреплена в bootstrap, CI и Dockerfile.
min_version = "2026.10.17"

[settings]
experimental = true
lockfile = true
lockfile_platforms = ["linux-x64", "linux-arm64", "macos-x64", "macos-arm64"]
task.run_auto_install = false
cargo.binstall_native = true

# Cargo использует официальные бинарники, а на macOS Intel собирает из исходников.
# У hk и pitchfork нет готовых macOS Intel releases.
[tool_alias.hk]
backend = "cargo:hk"

[tool_alias.pitchfork]
backend = "cargo:pitchfork-cli"

[tools]
# Версии инструментов задаются явно; doctor проверяет согласованность с языковыми файлами.
go = "1.26.10"
node = "24.21.0"
pnpm = "12.4.2"
golangci-lint = "2.13.2"
"go:golang.org/x/vuln/cmd/govulncheck" = "1.8.0"
sqlc = "1.31.1"
hk = "2.11.1"
pitchfork = "2.33.1"
rust = "1.95.0"
"conda:postgresql" = "18.6"

[env]
# Сначала dotenv, затем обязательные ограничения toolchain: env-файл не отменяет их.
_.file = { path = "{{ config_root }}/.env.local", optional = true }
GOTOOLCHAIN = "local"
RUSTUP_TOOLCHAIN = "1.95.0"

[hooks]
enter = 'if [ -z "${CI:-}" ]; then bash "{{ config_root }}/mise-tasks/doctor"; fi'
postinstall = 'if [ -z "${CI:-}" ]; then mise run setup:prepare; fi'

[daemons.postgres]
preset = "postgres"
version = "18.6"
tool = "conda:postgresql"
port = "auto"
data_dir = ".data/postgres"
options.database = "calendar"

[daemons.backend]
init = "mise run backend:dist"
run = 'export HTTP_ADDR="127.0.0.1:$BACKEND_PORT"; exec backend/bin/server'
port = { auto = true, base = 8080 }
proxy = false
depends = ["postgres"]
ready_cmd = 'curl --fail --silent "http://127.0.0.1:$BACKEND_PORT/readyz"'
ready_timeout = "120s"

[daemons.frontend]
init = "mise run api:generate"
run = 'export VITE_BACKEND_URL="http://127.0.0.1:$BACKEND_PORT"; exec pnpm --dir frontend exec vite --host 127.0.0.1 --port "$FRONTEND_PORT" --strictPort'
port = { auto = true, base = 5173 }
proxy = false
depends = ["backend"]
ready_cmd = 'curl --fail --silent "http://127.0.0.1:$FRONTEND_PORT/"'
ready_timeout = "120s"

[daemon_groups]
default = ["postgres", "backend", "frontend"]
dev = ["default"]

[tasks."backend:deps"]
description = "Загрузить Go-модули (из scripts/setup-worktree.sh: go mod download)"
dir = "{{ config_root }}/backend"
run = "go mod download"

[tasks."api:deps"]
description = "Установить инструменты API по lock-файлу (из scripts/setup-worktree.sh: pnpm --dir api install)"
dir = "{{ config_root }}/api"
run = "pnpm install --frozen-lockfile --prod=false"

[tasks."frontend:deps"]
description = "Установить зависимости frontend по lock-файлу (из scripts/setup-worktree.sh: pnpm install в frontend)"
dir = "{{ config_root }}/frontend"
run = "pnpm install --frozen-lockfile --prod=false"

[tasks."frontend:browser"]
description = "Установить Chromium для Playwright (из scripts/setup-worktree.sh: playwright install chromium)"
dir = "{{ config_root }}/frontend"
run = "pnpm exec playwright install chromium"

[tasks."frontend:browser-deps"]
description = "Установить системные библиотеки Chromium в Linux; могут потребоваться права root (новая задача)"
dir = "{{ config_root }}/frontend"
run = "pnpm exec playwright install-deps chromium"

[tasks."api:build"]
description = "Скомпилировать TypeSpec в OpenAPI (из api/package.json: scripts.build)"
dir = "{{ config_root }}/api"
run = "pnpm exec tsp compile ."

[tasks."api:generate"]
description = "Сгенерировать OpenAPI и Fetch-клиент (из api/package.json: scripts.generate)"
dir = "{{ config_root }}/api"
run = [{ task = "api:build" }, "pnpm exec openapi-ts"]

[tasks."api:check"]
description = "Проверить форматирование и компиляцию TypeSpec (из api/package.json: scripts.check)"
dir = "{{ config_root }}/api"
run = [
  'pnpm exec tsp format --check "**/*.tsp"',
  "pnpm exec tsp compile . --no-emit",
]

[tasks."api:format"]
description = "Отформатировать TypeSpec (из api/package.json: scripts.format)"
dir = "{{ config_root }}/api"
run = 'pnpm exec tsp format "**/*.tsp"'

[tasks."backend:api-generate"]
description = "Обновить сохраняемые в Git Go-модели и маршруты API (из Makefile: api-generate)"
dir = "{{ config_root }}/backend"
run = [
  { task = "api:build" },
  "go tool oapi-codegen --config oapi-models.yaml ../api/generated/openapi.yaml",
  "go tool oapi-codegen --config oapi-server.yaml ../api/generated/openapi.yaml",
]

[tasks."backend:sqlc-generate"]
description = "Обновить сохраняемый в Git Go-код БД (из Makefile: sqlc-generate)"
dir = "{{ config_root }}/backend"
run = "sqlc generate"

[tasks."backend:fmt"]
description = "Применить gofmt и goimports (из Makefile: fmt)"
dir = "{{ config_root }}/backend"
run = "golangci-lint fmt"

[tasks."backend:lint-fix"]
description = "Применить исправления линтера и показать изменения (из Makefile: lint-fix)"
dir = "{{ config_root }}/backend"
run = 'status=0; golangci-lint run --fix || status=$?; git diff -- .; exit "$status"'

[tasks."backend:vet"]
description = "Выполнить go vet (из Makefile: vet)"
dir = "{{ config_root }}/backend"
run = "go vet ./..."

[tasks."backend:test"]
description = "Запустить все тесты backend с детектором гонок и PostgreSQL; нужен Docker (из Makefile: test)"
dir = "{{ config_root }}/backend"
run = "go test -race -count=1 ./..."

[tasks."backend:test-unit"]
description = "Запустить модульные тесты backend без Docker (из Makefile: test-unit)"
dir = "{{ config_root }}/backend"
run = "go test -race -tags=unit ./..."

[tasks."backend:build"]
description = "Проверить сборку всех пакетов backend (из Makefile: build)"
dir = "{{ config_root }}/backend"
run = "go build ./..."

[tasks."backend:dist"]
description = "Собрать сервер и утилиту миграций для production (из Dockerfile: сборка Go-бинарников)"
dir = "{{ config_root }}/backend"
run = [
  "go build -trimpath -o bin/server ./cmd/server",
  "go build -trimpath -o bin/migrate ./cmd/migrate",
]

[tasks."backend:vuln"]
description = "Проверить вызываемые уязвимости Go (из Makefile: vuln)"
dir = "{{ config_root }}/backend"
run = "govulncheck ./..."

[tasks."backend:check"]
description = "Последовательно выполнить все проверки качества backend (из Makefile: check)"
run = [
  { task = "backend:lint" },
  { task = "backend:sqlc-check" },
  { task = "backend:vet" },
  { task = "backend:test" },
  { task = "backend:build" },
  { task = "backend:vuln" },
]

[tasks."backend:migrate-up"]
description = "Применить миграции к явно заданной DATABASE_URL (из Makefile: migrate-up)"
dir = "{{ config_root }}/backend"
run = 'go run ./cmd/migrate -dsn "${DATABASE_URL:?Set DATABASE_URL}" up'

[tasks."backend:migrate-down"]
description = "Откатить одну миграцию в DATABASE_URL (из Makefile: migrate-down)"
dir = "{{ config_root }}/backend"
run = 'go run ./cmd/migrate -dsn "${DATABASE_URL:?Set DATABASE_URL}" down'

[tasks."backend:migrate-status"]
description = "Показать состояние миграций в DATABASE_URL (из Makefile: migrate-status)"
dir = "{{ config_root }}/backend"
run = 'go run ./cmd/migrate -dsn "${DATABASE_URL:?Set DATABASE_URL}" status'

[tasks."frontend:typecheck"]
description = "Проверить TypeScript с уже сгенерированным API-клиентом (из frontend/package.json: scripts.typecheck)"
dir = "{{ config_root }}/frontend"
run = "pnpm exec tsc -b"

[tasks."frontend:build"]
description = "Сгенерировать клиент, проверить TypeScript и собрать frontend (из frontend/package.json: scripts.build)"
dir = "{{ config_root }}/frontend"
run = [
  { task = "api:generate" },
  { task = "frontend:typecheck" },
  "pnpm exec vite build",
]

[tasks."frontend:lint-code"]
description = "Проверить JS/TS с учётом типов (из frontend/package.json: scripts.lint:code)"
dir = "{{ config_root }}/frontend"
run = "pnpm exec oxlint ."

[tasks."frontend:lint-css"]
description = "Проверить CSS без предупреждений (из frontend/package.json: scripts.lint:css)"
dir = "{{ config_root }}/frontend"
run = 'pnpm exec stylelint "**/*.css" --max-warnings 0'

[tasks."frontend:lint"]
description = "Проверить код frontend и CSS (из frontend/package.json: scripts.lint)"
run = [{ task = "frontend:lint-code" }, { task = "frontend:lint-css" }]

[tasks."frontend:lint-fix"]
description = "Применить исправления Oxlint и Stylelint (из frontend/package.json: scripts.lint:fix)"
dir = "{{ config_root }}/frontend"
run = [
  "pnpm exec oxlint . --fix",
  'pnpm exec stylelint "**/*.css" --fix --max-warnings 0',
]

[tasks."frontend:format"]
description = "Отформатировать frontend с помощью Oxfmt (из frontend/package.json: scripts.format)"
dir = "{{ config_root }}/frontend"
run = "pnpm exec oxfmt ."

[tasks."frontend:format-check"]
description = "Проверить форматирование frontend (из frontend/package.json: scripts.format:check)"
dir = "{{ config_root }}/frontend"
run = "pnpm exec oxfmt --check ."

[tasks."frontend:check"]
description = "Проверить контракт, генерацию клиента, линтеры и форматирование (из frontend/package.json: scripts.check)"
run = [
  { task = "api:check" },
  { task = "api:generate" },
  { task = "frontend:lint" },
  { task = "frontend:format-check" },
]

[tasks."frontend:preview"]
description = "Запустить предварительный просмотр сборки frontend (из frontend/package.json: scripts.preview)"
dir = "{{ config_root }}/frontend"
run = "pnpm exec vite preview"

[tasks."frontend:test"]
description = "Запустить Playwright для готовой сборки; можно передать файлы тестов (выделена из frontend/package.json: scripts.test:smoke)"
dir = "{{ config_root }}/frontend"
run = "pnpm exec playwright test"

[tasks."frontend:test-smoke"]
description = "Собрать frontend и запустить браузерные smoke-тесты; нужен Docker (из frontend/package.json: scripts.test:smoke)"
run = [{ task = "frontend:build" }, { task = "frontend:test" }]

[tasks."container:test"]
description = "Собрать production-образ и проверить его с отдельной PostgreSQL (из Makefile: test-container)"
run = "python3 scripts/container-smoke.py"

[tasks."hooks:install"]
description = "Установить локальный commit-msg hook репозитория через mise (новая задача)"
run = 'if [ -z "${CI:-}" ]; then hk validate && hk install --mise --legacy --force-local; fi'

[tasks.check]
description = "Проверить качество, сборку и браузерные сценарии backend/frontend (из scripts/setup-worktree.sh: SETUP_VERIFY=1)"
run = [
  { task = "backend:check" },
  { task = "frontend:check" },
  { task = "frontend:test-smoke" },
]

[tasks."workflow:test"]
description = "Проверить поведение команд окружения разработки (новая задача)"
run = "node --test scripts/tests/*.test.mjs"
