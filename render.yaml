# yaml-language-server: $schema=https://render.com/schema/render.yaml.json
services:
  - type: web
    name: calendar-demo
    runtime: docker
    plan: free
    region: frankfurt
    branch: main
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /readyz
    autoDeployTrigger: checksPass
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: calendar-demo-db
          property: connectionString

databases:
  - name: calendar-demo-db
    plan: free
    region: frankfurt
    postgresMajorVersion: "18"
    ipAllowList: []
