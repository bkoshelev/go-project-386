name: check

on:
  push:
    branches: [main]
  pull_request:

env:
  MISE_NO_HOOKS: "1"
  GOTOOLCHAIN: local

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v5
        with:
          version: 2026.10.17
          install_args: --locked go node pnpm golangci-lint sqlc hk go:golang.org/x/vuln/cmd/govulncheck
      - name: Install API tooling
        run: mise run api:deps
      - name: Install frontend dependencies
        run: mise run frontend:deps
      - name: Download backend dependencies
        run: mise run backend:deps
      - name: Verify Docker and Chrome
        run: docker info && google-chrome --version
      - name: Run checks
        run: mise run check
      - name: Upload diagnostics
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: check-diagnostics
          path: |
            artifacts/container-smoke/
            frontend/test-results/
          if-no-files-found: warn
          retention-days: 7
