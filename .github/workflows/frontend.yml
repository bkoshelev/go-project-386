name: frontend

on:
  push:
  pull_request:

env:
  MISE_NO_HOOKS: "1"

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v5
        with:
          version: 2026.10.17
          install_args: --locked node pnpm
      - name: Install API tooling
        run: mise run api:deps
      - name: Install frontend dependencies
        run: mise run frontend:deps
      - name: Check frontend
        run: mise run frontend:check

  smoke-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v5
        with:
          version: 2026.10.17
          install_args: --locked go node pnpm
      - name: Install API tooling
        run: mise run api:deps
      - name: Install frontend dependencies
        run: mise run frontend:deps
      - name: Download backend dependencies
        run: mise run backend:deps
      - name: Verify Docker
        run: docker info
      - name: Verify preinstalled Chrome
        run: google-chrome --version
      - name: Run production smoke tests
        run: mise run frontend:test-smoke
