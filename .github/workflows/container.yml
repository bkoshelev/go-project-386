name: container

on:
  push:
    branches: [main]
  pull_request:

env:
  MISE_NO_HOOKS: "1"

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - uses: jdx/mise-action@v5
        with:
          version: 2026.10.17
          install_args: --locked node pnpm

      - name: Install frontend dependencies
        run: mise run frontend:deps

      - name: Verify preinstalled Google Chrome
        run: google-chrome --version

      - name: Test production image with external PostgreSQL
        run: mise run container:test

      - name: Upload diagnostics
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: container-smoke
          path: artifacts/container-smoke/
          if-no-files-found: warn
          retention-days: 7
