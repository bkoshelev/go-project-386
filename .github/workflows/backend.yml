name: backend

on:
  push:
  pull_request:

env:
  MISE_NO_HOOKS: "1"
  GOTOOLCHAIN: local

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v5
        with:
          version: 2026.10.17
          install_args: go sqlc
      - name: Download dependencies
        run: mise run backend:deps
      - name: Verify generated database code
        run: mise run backend:sqlc-check
      - name: Verify Docker is available
        run: docker info
      - name: Run go vet
        run: mise run backend:vet
      - name: Run tests with race detector
        run: mise run backend:test
      - name: Build packages
        run: mise run backend:build

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v5
        with:
          version: 2026.10.17
          install_args: go golangci-lint
      - name: Download dependencies
        run: mise run backend:deps
      - name: Run backend linters
        run: mise run backend:lint

  govulncheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v5
        with:
          version: 2026.10.17
          install_args: go go:golang.org/x/vuln/cmd/govulncheck
      - name: Download dependencies
        run: mise run backend:deps
      - name: Scan reachable vulnerabilities
        run: mise run backend:vuln
