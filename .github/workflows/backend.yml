name: backend

on:
  push:
  pull_request:

# Проверки должны использовать установленный из go.mod Go без автоматической смены toolchain.
env:
  GOTOOLCHAIN: local

jobs:
  checks:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: Verify pinned Go version
        run: make check-go-version
        working-directory: ${{ github.workspace }}

      - name: Download dependencies
        run: go mod download

      - name: Install pinned sqlc
        run: make tools-sqlc
        working-directory: ${{ github.workspace }}

      - name: Verify generated database code
        run: make sqlc-check
        working-directory: ${{ github.workspace }}

      - name: Verify Docker is available
        run: docker info

      - name: Run go vet
        run: go vet ./...

      - name: Run tests with race detector
        run: make test
        working-directory: ${{ github.workspace }}

      - name: Build packages
        run: go build ./...

  lint:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: Install pinned backend tools
        run: make tools
        working-directory: ${{ github.workspace }}

      - name: Run backend linters
        run: make lint
        working-directory: ${{ github.workspace }}

  govulncheck:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: Install pinned backend tools
        run: make tools
        working-directory: ${{ github.workspace }}

      - name: Scan backend for known vulnerabilities
        run: make vuln
        working-directory: ${{ github.workspace }}
