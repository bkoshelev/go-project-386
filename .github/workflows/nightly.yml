name: nightly

on:
  schedule:
    - cron: '17 2 * * *'
  workflow_dispatch:

concurrency:
  group: nightly-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  actions: read

defaults:
  run:
    shell: bash

env:
  MISE_NO_HOOKS: "1"
  GOTOOLCHAIN: local

jobs:
  govulncheck:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v5
        id: mise
        with:
          version: 2026.10.17
          install_args: --locked go go:golang.org/x/vuln/cmd/govulncheck
      - run: mise run backend:deps
      - run: mise run backend:vuln 2>&1 | tee job.log
      - name: Upload failure log
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: govulncheck-failure
          path: job.log
          if-no-files-found: warn
          retention-days: 7
      - name: Record available job data
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          CACHE_HIT: ${{ steps.mise.outputs.cache-hit }}
        run: |
          gh api --paginate --slurp "repos/$REPOSITORY/actions/runs/$RUN_ID/attempts/$RUN_ATTEMPT/jobs?per_page=100" | jq --arg cache "${CACHE_HIT:-unavailable}" '{jobs: [.[].jobs[]], mise_cache_hit: $cache, retries: "unavailable"}' > job-report.json || printf '%s\n' '{"jobs": "unavailable", "cache": "unavailable", "retries": "unavailable"}' > job-report.json
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: govulncheck-report
          path: job-report.json
          retention-days: 7
  race:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v5
        id: mise
        with:
          version: 2026.10.17
          install_args: --locked go
      - run: mise run backend:deps
      - run: mise run backend:test-race 2>&1 | tee job.log
      - name: Upload failure log
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: race-failure
          path: job.log
          if-no-files-found: warn
          retention-days: 7
      - name: Record available job data
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          CACHE_HIT: ${{ steps.mise.outputs.cache-hit }}
        run: |
          gh api --paginate --slurp "repos/$REPOSITORY/actions/runs/$RUN_ID/attempts/$RUN_ATTEMPT/jobs?per_page=100" | jq --arg cache "${CACHE_HIT:-unavailable}" '{jobs: [.[].jobs[]], mise_cache_hit: $cache, retries: "unavailable"}' > job-report.json || printf '%s\n' '{"jobs": "unavailable", "cache": "unavailable", "retries": "unavailable"}' > job-report.json
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: race-report
          path: job-report.json
          retention-days: 7
  container:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v5
        id: mise
        with:
          version: 2026.10.17
          install_args: --locked go node pnpm
      - run: mise run frontend:deps
      - run: mise run container:test 2>&1 | tee job.log
      - name: Upload diagnostics
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: container-diagnostics
          path: |
            artifacts/container-smoke/
            job.log
          if-no-files-found: warn
          retention-days: 7
      - name: Record available job data
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          CACHE_HIT: ${{ steps.mise.outputs.cache-hit }}
        run: |
          gh api --paginate --slurp "repos/$REPOSITORY/actions/runs/$RUN_ID/attempts/$RUN_ATTEMPT/jobs?per_page=100" | jq --arg cache "${CACHE_HIT:-unavailable}" '{jobs: [.[].jobs[]], mise_cache_hit: $cache, retries: "unavailable"}' > job-report.json || printf '%s\n' '{"jobs": "unavailable", "cache": "unavailable", "retries": "unavailable"}' > job-report.json
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: container-report
          path: job-report.json
          retention-days: 7
