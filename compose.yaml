name: calendar

services:
  db:
    image: postgres:18.6-alpine
    environment:
      POSTGRES_USER: calendar
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      POSTGRES_DB: calendar
    volumes:
      - database:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U calendar -d calendar"]
      interval: 2s
      timeout: 2s
      retries: 30

  app:
    build: .
    environment:
      DATABASE_URL: postgres://calendar:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}@db:5432/calendar?sslmode=disable
      PORT: ${PORT:-8080}
    ports:
      - "127.0.0.1:${APP_HOST_PORT:-8080}:${PORT:-8080}"
    depends_on:
      db:
        condition: service_healthy
    stop_grace_period: 15s

volumes:
  database:
