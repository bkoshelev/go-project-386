# Используется схема golangci-lint v2, соответствующая закреплённой версии инструмента.
version: "2"

run:
  # Анализируем тесты наравне с production-кодом, чтобы не скрывать дефекты в проверках.
  tests: true
  # Ограничиваем зависший анализ и сохраняем предсказуемое время локальной и CI-проверки.
  timeout: 5m

linters:
  # Отключаем меняющийся набор по умолчанию и поддерживаем явный стабильный список проверок.
  default: none
  enable:
    # Ищет дефекты и некорректные конструкции на основе расширенного статического анализа.
    - staticcheck
    # Находит присваивания, значение которых не используется.
    - ineffassign
    # Находит неиспользуемый код, который усложняет сопровождение.
    - unused
    # Требует обрабатывать возвращаемые ошибки.
    - errcheck
    # Проверяет корректное оборачивание, сравнение и распознавание ошибок.
    - errorlint
    # Ищет потенциально небезопасные конструкции исходного кода.
    - gosec
    # Проверяет закрытие тела исходящих HTTP-ответов.
    - bodyclose
    # Требует передавать context в исходящие HTTP-запросы.
    - noctx
    # Проверяет закрытие SQL-ресурсов поддерживаемых библиотек.
    - sqlclosecheck
    # Требует проверять ошибку после итерации по SQL-строкам.
    - rowserrcheck
    # Находит некорректное и неидиоматичное использование Testify.
    - testifylint
    # Применяет выбранные правила именования, стиля и документации.
    - revive
    # Проверяет точность и обоснованность директив nolint.
    - nolintlint
  settings:
    errcheck:
      # Проверяем даже ошибки, явно присвоенные в _, чтобы подавление требовало объяснения.
      check-blank: true
    revive:
      # Не включаем меняющийся набор revive по умолчанию: действуют только перечисленные правила.
      enable-all-rules: false
      rules:
        # Требует комментарии к экспортируемым именам, включая код в internal.
        - name: exported
        # Поддерживает принятые соглашения об именах переменных и пакетов.
        - name: var-naming
        # Требует согласованных коротких имён получателей методов.
        - name: receiver-naming
        # Проверяет соглашения об именах переменных ошибок.
        - name: error-naming
        # Требует строчные тексты ошибок без завершающей пунктуации.
        - name: error-strings
        # Требует размещать error последним среди возвращаемых значений.
        - name: error-return
        # Требует размещать context первым аргументом функции.
        - name: context-as-argument
        # Запрещает встроенные типы в качестве ключей context.
        - name: context-keys-type
        # Предпочитает идиоматичные операции ++ и -- арифметическому присваиванию.
        - name: increment-decrement
        # Упрощает ветвление после обработки ошибок.
        - name: indent-error-flow
    nolintlint:
      # Каждое подавление должно называть конкретный линтер, а не отключать все проверки.
      require-specific: true
      # Каждое подавление должно содержать содержательную причину.
      require-explanation: true
      # Не разрешаем оставлять устаревшие и больше не используемые подавления.
      allow-unused: false
  exclusions:
    # Исключаем только файлы с точным стандартным маркером Code generated ... DO NOT EDIT.
    generated: strict

formatters:
  enable:
    # Применяет каноническое форматирование исходников Go.
    - gofmt
    # Нормализует и группирует импорты, включая отдельную группу текущего модуля.
    - goimports
  settings:
    goimports:
      # Отделяем импорты текущего backend-модуля от сторонних зависимостей.
      local-prefixes:
        - github.com/bkoshelev/go-project-386/backend
  exclusions:
    # Не изменяем файлы с точным стандартным маркером сгенерированного кода.
    generated: strict
