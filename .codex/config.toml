# Project-scoped MCP servers for UI development.
# Keep package versions explicit; update them deliberately.
# Chrome is installed under /Applications/Browsers on this machine.

[mcp_servers.playwright]
command = "npx"
args = [
  "-y",
  "@playwright/mcp@0.0.83",
  "--isolated",
  "--executable-path",
  "/Applications/Browsers/Google Chrome.app/Contents/MacOS/Google Chrome",
  "--output-dir",
  ".mcp-output/playwright",
]
startup_timeout_sec = 60

[mcp_servers.chrome-devtools]
command = "npx"
args = [
  "-y",
  "chrome-devtools-mcp@1.11.0",
  # TODO(chrome-devtools-mcp): при обновлении проверить необходимость флага.
  # Удалить, когда list_3p_developer_tools и execute_3p_developer_tool доступны
  # по умолчанию; подтвердить вызовом React-инструмента без флага.
  "--categoryExperimentalThirdParty=true",
  "--isolated",
  "--executablePath",
  "/Applications/Browsers/Google Chrome.app/Contents/MacOS/Google Chrome",
  "--no-usage-statistics",
]
startup_timeout_sec = 60

[mcp_servers.mantine]
command = "npx"
args = ["-y", "@mantine/mcp-server@9.7.3"]
startup_timeout_sec = 60
